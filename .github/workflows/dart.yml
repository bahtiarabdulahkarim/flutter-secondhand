name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Use Flutter setup instead of Dart setup
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Adjust version as needed

      - name: Install dependencies
        run: flutter pub get  # Changed from 'dart pub get'

      - name: Analyze project source
        run: flutter analyze  # Changed from 'dart analyze'

      - name: Run tests
        run: flutter test  # Changed from 'dart test'